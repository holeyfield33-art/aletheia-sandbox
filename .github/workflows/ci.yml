name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, typecheck, and the no-DB unit suite across supported platforms + Node versions.
  unit:
    name: unit (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test   # core jail + SQL guard, no database needed

  # Live Postgres path with BOTH a read-only and a writable role + persistent canary.
  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: sandbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d sandbox"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Seed schema + roles + canary
        env:
          PGPASSWORD: admin
        run: psql -h localhost -p 5432 -U admin -d sandbox -v ON_ERROR_STOP=1 -f scripts/init-readonly.sql
      - name: Integration tests (read-only + writable roles)
        env:
          DATABASE_URL: postgres://readonly:readonly@localhost:5432/sandbox
          DATABASE_URL_WRITABLE: postgres://writable:writable@localhost:5432/sandbox
        run: npm run test:integration

  # Package smoke: install the packed tarball and drive the installed binary via MCP.
  package-smoke:
    name: package smoke (installed binary + MCP)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: sandbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d sandbox"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination /tmp
      - name: Install psql + seed
        env:
          PGPASSWORD: admin
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U admin -d sandbox -v ON_ERROR_STOP=1 -f scripts/init-readonly.sql
      - name: Install tarball into a clean project
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install /tmp/aletheia-sandbox-*.tgz
      - name: Binary refuses to start without DATABASE_URL (exit 1)
        working-directory: /tmp/smoke
        run: |
          if node node_modules/.bin/aletheia-sandbox-pg; then
            echo "ERROR: binary should have exited non-zero without DATABASE_URL"; exit 1
          else
            echo "OK: refused to start without DATABASE_URL"
          fi
      - name: End-to-end MCP invocation against read-only role
        working-directory: /tmp/smoke
        env:
          DATABASE_URL: postgres://readonly:readonly@localhost:5432/sandbox
        run: |
          cp "$GITHUB_WORKSPACE/scripts/mcp-smoke.mjs" ./mcp-smoke.mjs
          node mcp-smoke.mjs
